name: Fork compatibility checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
      - run: bash .github/scripts/download-geodata.sh resources
      - run: go test -timeout 10m ./proxy/vless/... ./proxy/anytls/... ./proxy/tuic/... ./proxy/shadowsocks/... ./transport/internet/reality/... ./transport/internet/splithttp/... ./transport/internet/grpc/... ./transport/internet/tuic/... ./infra/conf/... ./common/mux/...
      - run: go build -o /tmp/xray ./main
